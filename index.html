/* ============================================================
   edulab - Colors & Type foundation
   Fonts loaded from Google Fonts (CDN). See README "Visual
   Foundations" for substitution notes.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap');

:root {
  /* ---- Brand fonts ---- */
  --font-display: 'Outfit', 'IBM Plex Sans', system-ui, sans-serif;
  --font-sans:    'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --font-mono:    'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* ============================================================
     RAW COLOR TOKENS
     ============================================================ */

  /* Paper - page background is white; the sand steps are wells/alternating sections */
  --paper:    #FFFFFF;   /* page background (white)    */
  --paper-2:  #FBF7E6;   /* alternating section        */
  --paper-3:  #F5EDCB;   /* deepest sand / wells       */
  --surface:  #FFFFFF;   /* cards & sheets             */

  /* Ink - warm near-black text & lines */
  --ink:      #1C1917;   /* primary text               */
  --ink-2:    #57534E;   /* secondary text             */
  --ink-3:    #948C82;   /* muted / placeholder        */
  --line:     #EDE7D2;   /* hairline borders           */
  --line-2:   #DDD4B6;   /* stronger borders           */

  /* ---- Brand: Yellow main · Blue + Green secondary · Red danger ----
     Plain saturated colours. A "-soft" tint IS the saturated colour
     (panels and chips are solid), "-ink" is the text colour ON it:
     white on blue/green/red, dark ink on yellow. Never colour-on-colour
     (no green text on green); the saturated colour itself goes only on
     white or black. */

  /* Yellow - primary (buttons, progress, values on dark panels) */
  --yellow:      #FFD500;
  --yellow-600:  #F0C800;  /* hover / press          */
  --yellow-soft: #FFD500;  /* chip / panel fill      */
  --yellow-ink:  #1C1917;  /* text on yellow         */

  /* Blue - secondary (panels, chips, correct / selected state) */
  --blue:      #1E8FC2;
  --blue-600:  #177AA8;
  --blue-soft: #1E8FC2;
  --blue-ink:  #FFFFFF;

  /* Green - secondary support (chips, success) */
  --green:      #00A651;
  --green-600:  #009444;
  --green-soft: #00A651;
  --green-ink:  #FFFFFF;

  /* Red - danger / important / wrong (use sparingly) */
  --red:      #E5322D;
  --red-600:  #C92823;
  --red-soft: #E5322D;
  --red-ink:  #FFFFFF;

  /* Legacy role aliases - older edulab apps use these names */
  --marigold: var(--yellow); --marigold-600: var(--yellow-600); --marigold-soft: var(--yellow-soft); --marigold-ink: var(--yellow-ink);
  --teal:     var(--blue);   --teal-600:     var(--blue-600);   --teal-soft:     var(--blue-soft);   --teal-ink:     var(--blue-ink);
  --sky:      var(--green);                                     --sky-soft:      var(--green-soft);  --sky-ink:      var(--green-ink);
  --coral:    var(--red);    --coral-600:    var(--red-600);    --coral-soft:    var(--red-soft);    --coral-ink:    var(--red-ink);

  /* Play palette - subject/category colours in the kids app */
  --play-sun:    #FFD500;
  --play-grass:  #00A651;
  --play-berry:  #C6478B;
  --play-grape:  #7A5AC2;
  --play-sky:    #1E8FC2;
  --play-coral:  #E5322D;

  /* ---- Semantic ---- */
  --success:      #00A651;  --success-soft: #00A651;  --success-ink: #FFFFFF;
  --warning:      #FFD500;  --warning-soft: #FFD500;  --warning-ink: #1C1917;
  --danger:       #E5322D;  --danger-soft:  #E5322D;  --danger-ink:  #FFFFFF;
  --info:         #1E8FC2;  --info-soft:    #1E8FC2;  --info-ink:    #FFFFFF;

  /* ---- Functional aliases ---- */
  --bg:        var(--paper);
  --fg:        var(--ink);
  --fg-muted:  var(--ink-2);
  --primary:   var(--yellow);
  --on-primary:#1C1917;      /* dark text on yellow */
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--yellow) 45%, transparent);

  /* ============================================================
     SPACING  (4pt base)
     ============================================================ */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
  --sp-12: 48px; --sp-16: 64px; --sp-20: 80px; --sp-24: 96px;

  /* ---- Radii (friendly, generous) ---- */
  --r-xs: 6px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* ---- Elevation - warm, low, soft ---- */
  --shadow-sm: 0 1px 2px rgba(33,30,26,.06), 0 1px 1px rgba(33,30,26,.04);
  --shadow-md: 0 4px 16px rgba(33,30,26,.08), 0 1px 3px rgba(33,30,26,.05);
  --shadow-lg: 0 16px 40px rgba(33,30,26,.12), 0 3px 8px rgba(33,30,26,.06);
  --shadow-primary:  0 8px 22px color-mix(in srgb, var(--yellow) 30%, transparent);
  --shadow-marigold: var(--shadow-primary);   /* legacy alias */

  /* ============================================================
     TYPE SCALE (semantic sizes)
     ============================================================ */
  --display-font:  clamp(48px, 6vw, 72px);
  --h1: 44px; --h2: 33px; --h3: 25px; --h4: 19px;
  --body-lg: 18px; --body: 16px; --body-sm: 14px;
  --caption: 13px; --overline: 12px;
}

/* ============================================================
   SEMANTIC ELEMENT STYLES
   Apply via element selectors or .edu-prose wrapper.
   ============================================================ */

.edu-display, .edu h1.display {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--display-font);
  line-height: 1.02;
  letter-spacing: -0.025em;
  color: var(--ink);
}
.edu h1, .edu-h1 {
  font-family: var(--font-display);
  font-weight: 700; font-size: var(--h1);
  line-height: 1.06; letter-spacing: -0.02em; color: var(--ink);
}
.edu h2, .edu-h2 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h2);
  line-height: 1.12; letter-spacing: -0.015em; color: var(--ink);
}
.edu h3, .edu-h3 {
  font-family: var(--font-display);
  font-weight: 600; font-size: var(--h3);
  line-height: 1.2; letter-spacing: -0.01em; color: var(--ink);
}
.edu h4, .edu-h4 {
  font-family: var(--font-sans);
  font-weight: 700; font-size: var(--h4);
  line-height: 1.3; color: var(--ink);
}
.edu p, .edu-p, .edu-body {
  font-family: var(--font-sans);
  font-weight: 400; font-size: var(--body);
  line-height: 1.6; color: var(--ink-2);
}
.edu-body-lg { font-family: var(--font-sans); font-size: var(--body-lg); line-height: 1.6; color: var(--ink-2); }
.edu-small  { font-family: var(--font-sans); font-size: var(--body-sm); line-height: 1.5; color: var(--ink-2); }
.edu-caption{ font-family: var(--font-sans); font-size: var(--caption); line-height: 1.45; color: var(--ink-3); }

/* Overline - mono, tracked; functional labels only (never above page/section titles) */
.edu-overline {
  font-family: var(--font-mono);
  font-weight: 500; font-size: var(--overline);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink);
}
.edu code, .edu-mono {
  font-family: var(--font-mono);
  font-size: 0.92em; color: var(--ink);
  background: var(--paper-3); padding: 0.12em 0.4em; border-radius: var(--r-xs);
}

/* Solid colour blocks (callouts, stat cards, chips): set background: var(--X-soft) and
   color: var(--X-ink) on the block, add .edu-block, and every heading/paragraph inside
   inherits that text colour instead of the default ink. */
.edu-block, .edu-block h1, .edu-block h2, .edu-block h3, .edu-block h4, .edu-block p,
.edu-block li, .edu-block small { color: inherit; }

body.edu { background: var(--paper); color: var(--ink); font-family: var(--font-sans); }

    /* ─── App tokens (mapped onto edulab) ─── */
    :root {
      --bg: var(--paper); --bg2: var(--paper-2); --bg3: var(--paper-3);
      --border: var(--line); --text: var(--ink); --muted: var(--ink-2); --muted-2: var(--ink-3);
      --c0: var(--play-sky); --c1: var(--play-grape); --c2: var(--play-grass); --c3: var(--play-berry); --c4: var(--play-coral); --c5: var(--play-sun);
      --c0-ink: #FFFFFF; --c1-ink: #FFFFFF; --c2-ink: #FFFFFF; --c3-ink: #FFFFFF; --c4-ink: #FFFFFF; --c5-ink: var(--ink);
      --term-bg: var(--ink); --term-border: rgba(255,255,255,.14); --term-text: rgba(255,255,255,.82);
      --term-info: #7CC4EA; --term-success: #5FD08F; --term-warn: var(--yellow); --term-error: #FF7B76; --term-step: #C9B3FF;
      --chart-bg: var(--ink); --chart-loss: var(--red); --chart-acc: var(--green); --chart-val: var(--yellow);
      --overlay: rgba(28,25,23,.55); --scrim: rgba(28,25,23,.45);
      --chrome-bg: color-mix(in srgb, var(--paper) 85%, transparent); --chrome-bg-strong: color-mix(in srgb, var(--paper) 90%, transparent);
      --guide-line: color-mix(in srgb, var(--paper) 60%, transparent); --cam-shade: color-mix(in srgb, var(--ink) 35%, transparent);
      --touch: 48px; --bar-h: 68px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body { font-family: var(--font-sans); background: var(--paper); color: var(--ink); min-height: 100%; overscroll-behavior: none; }
    button, input, select { font-family: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ─── Screens ─── */
    .screen { display: none; min-height: 100vh; min-height: 100dvh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ─── Brand header (edulab chrome) ─── */
    .edu-header { position: sticky; top: 0; z-index: 50; width: 100%; background: var(--chrome-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
    .edu-header-inner { max-width: 1100px; margin: 0 auto; padding: 6px 16px; display: flex; align-items: center; gap: 10px; }
    .edu-logo { width: 56px; height: 56px; display: block; margin-right: -6px; }
    .edu-wordmark { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
    .edu-header-inner .lang-btn { margin-left: auto; }

    /* ─── Home ─── */
    #screen-home { background: var(--paper); }
    .home-main { flex: 1; display: flex; flex-direction: column; gap: 18px; width: 100%; max-width: 900px; margin: 0 auto; padding: 22px 16px 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
    .home-logo { max-width: 560px; }
    .home-logo h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.1rem, 8vw, 2.75rem); letter-spacing: -.025em; line-height: 1.05; color: var(--ink); }
    .home-logo h1 span { color: var(--ink-3); font-weight: 500; }
    .home-logo p { color: var(--ink-2); font-size: 1rem; line-height: 1.5; margin-top: 6px; }
    .home-cards { flex: 1; display: grid; grid-template-rows: 1fr 1fr; gap: 14px; width: 100%; min-height: 0; }
    .mode-card { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; grid-template-areas: 'icon arrow' 'info info'; align-items: start; gap: 12px; padding: 20px; min-height: 180px; border: none; border-radius: var(--r-xl); cursor: pointer; transition: transform .12s cubic-bezier(.32,.72,.32,1); user-select: none; text-align: left; width: 100%; }
    .mode-card:active { transform: scale(.985); }
    .mode-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .mode-icon { grid-area: icon; width: 56px; height: 56px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; }
    .mode-icon .lucide-lg { width: 28px; height: 28px; }
    .mode-arrow { grid-area: arrow; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: var(--r-pill); }
    .mode-info { grid-area: info; align-self: end; }
    .mode-info h2 { font-family: var(--font-display); font-size: clamp(22px, 6vw, 28px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
    .mode-info p { font-size: 14px; margin-top: 6px; line-height: 1.45; max-width: 34ch; opacity: .82; }
    .mode-card.train { background: var(--yellow-soft); color: var(--yellow-ink); }
    .mode-card.train .mode-icon { background: var(--ink); color: var(--yellow); }
    .mode-card.train .mode-arrow { background: color-mix(in srgb, var(--ink) 12%, transparent); color: var(--ink); }
    .mode-card.infer { background: var(--blue-soft); color: var(--blue-ink); }
    .mode-card.infer .mode-icon { background: var(--paper); color: var(--blue); }
    .mode-card.infer .mode-arrow { background: color-mix(in srgb, var(--paper) 22%, transparent); color: var(--blue-ink); }
    .home-foot { margin-top: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; padding-top: 6px; }
    .home-foot .chip, .home-foot .chip.ok, .home-foot .chip.busy, .home-foot .chip.err { background: transparent; border: 1px solid var(--line); color: var(--ink-3); font-size: 10px; padding: 3px 9px; font-weight: 400; letter-spacing: .05em; }
    .home-foot .chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); opacity: .5; }
    .home-foot .chip.ok::before { background: var(--green); opacity: 1; }
    .home-foot .chip.busy::before { background: var(--yellow); opacity: 1; }
    .home-foot .chip.err::before { background: var(--red); opacity: 1; }
    @media (min-width: 769px) { .home-cards { grid-template-rows: none; grid-template-columns: 1fr 1fr; max-height: 420px; } .home-main { justify-content: center; gap: 28px; } .mode-card { min-height: 260px; padding: 26px; } }

    /* ─── Top bar ─── */
    .top-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; padding-top: calc(env(safe-area-inset-top, 0px) + 8px); background: var(--chrome-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); flex-shrink: 0; position: sticky; top: 0; z-index: 5; }
    .top-bar .edu-logo { width: 44px; height: 44px; margin-right: -4px; }
    .icon-btn { background: none; border: none; color: var(--ink); cursor: pointer; width: 44px; height: 44px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-btn:active { background: var(--paper-2); }
    .top-bar h2 { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: var(--r-pill); background: var(--paper-3); color: var(--ink); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .chip.ok { background: var(--green-soft); color: var(--green-ink); }
    .chip.busy { background: var(--yellow-soft); color: var(--yellow-ink); }
    .chip.err { background: var(--red-soft); color: var(--red-ink); }
    .lang-btn { background: var(--paper-2); border: none; color: var(--ink-2); font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .08em; height: 36px; padding: 0 12px; border-radius: var(--r-pill); cursor: pointer; }
    .lang-btn:active { background: var(--paper-3); }

    /* ─── Scroll content ─── */
    .scroll-area { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 20px); background: var(--paper); }

    /* ─── Step cards ─── */
    .step-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; transition: border-color .2s; }
    .step-card[data-state="active"] { border-color: var(--ink); }
    .step-card[data-state="done"] { border-color: var(--green); }
    .step-card[data-state="error"] { border-color: var(--red); }
    .step-card[data-state="processing"] { border-color: var(--yellow); }
    .step-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: var(--touch); cursor: pointer; user-select: none; width: 100%; background: none; border: none; text-align: left; color: inherit; }
    .step-num { width: 30px; height: 30px; border-radius: var(--r-pill); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; font-weight: 500; background: var(--paper-3); color: var(--ink-2); transition: background .2s; }
    [data-state="active"] .step-num { background: var(--yellow); color: var(--yellow-ink); }
    [data-state="done"] .step-num { background: var(--green); color: var(--green-ink); }
    [data-state="error"] .step-num { background: var(--red); color: var(--red-ink); }
    [data-state="processing"] .step-num { background: var(--yellow); color: var(--yellow-ink); animation: proc-pulse 1.2s ease-in-out infinite; }
    @keyframes proc-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    .step-title { flex: 1; font-family: var(--font-display); font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
    .step-badge { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: var(--r-pill); background: var(--paper-3); color: var(--ink-2); }
    [data-state="done"] .step-badge { background: var(--green-soft); color: var(--green-ink); }
    [data-state="error"] .step-badge { background: var(--red-soft); color: var(--red-ink); }
    [data-state="processing"] .step-badge { background: var(--yellow-soft); color: var(--yellow-ink); }
    [data-state="active"] .step-badge { background: var(--ink); color: var(--paper); }
    .step-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
    .step-body.collapsed { display: none; }

    /* ─── Camera ─── */
    .cam-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--paper-3); border-radius: var(--r-md); overflow: hidden; }
    .cam-wrap video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam-wrap.mirror video { transform: scaleX(-1); }
    .cam-guide { position: absolute; inset: 8%; border: 1.5px dashed var(--guide-line); border-radius: var(--r-xs); pointer-events: none; }
    .cam-overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 10px; background: linear-gradient(to top, var(--cam-shade) 0%, transparent 40%); pointer-events: none; }
    .cam-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--paper); background: var(--overlay); padding: 5px 10px; border-radius: var(--r-pill); }
    .cam-fab { position: absolute; top: 8px; right: 8px; background: var(--overlay); border: none; color: var(--paper); width: 44px; height: 44px; border-radius: var(--r-pill); cursor: pointer; z-index: 2; display: flex; align-items: center; justify-content: center; }
    .cam-rec { position: absolute; top: 12px; left: 12px; display: none; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--red-ink); background: var(--red-soft); padding: 5px 10px; border-radius: var(--r-pill); }
    .cam-wrap.recording .cam-rec { display: inline-flex; }

    /* ─── Buttons ─── */
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 22px; border-radius: var(--r-pill); font-family: var(--font-display); font-size: 15px; font-weight: 600; border: none; cursor: pointer; transition: background .15s, transform .12s cubic-bezier(.32,.72,.32,1); user-select: none; -webkit-user-select: none; min-height: var(--touch); touch-action: manipulation; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    .btn-primary { background: var(--yellow); color: var(--on-primary); box-shadow: var(--shadow-primary); }
    .btn-primary:hover { background: var(--yellow-600); }
    .btn-success { background: var(--green); color: var(--green-ink); }
    .btn-danger { background: var(--red); color: var(--red-ink); }
    .btn-secondary { background: var(--paper-2); color: var(--ink); }
    .btn-secondary:hover { background: var(--paper-3); }
    .btn-sm { padding: 8px 16px; font-size: 14px; min-height: 40px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }

    /* ─── Classes ─── */
    .class-list { display: flex; flex-direction: column; gap: 10px; }

    .class-bottom { display: flex; align-items: stretch; gap: 8px; }
    .hold-btn { flex: 1; min-height: var(--touch); border: none; border-radius: var(--r-pill); color: var(--cls-ink, var(--paper)); background: var(--cls-color, var(--ink)); font-family: var(--font-display); font-size: 15px; font-weight: 600; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s, opacity .15s; }
    .hold-btn.holding { transform: scale(.97); opacity: .85; }
    .hold-btn:disabled { opacity: .4; cursor: not-allowed; }
    .class-menu-btn { width: var(--touch); min-height: var(--touch); border-radius: var(--r-pill); border: none; background: var(--surface); color: var(--ink-2); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-sm); }
    .thumb-strip { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .thumb-strip:empty { display: none; }
    .thumb-strip img { width: 48px; height: 48px; object-fit: cover; border-radius: var(--r-xs); flex-shrink: 0; background: var(--paper-3); }

    /* ─── Params ─── */
    .param-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
    .param-row:last-child { border-bottom: none; }
    .param-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); flex: 1; }
    .param-row select, .param-row input[type="number"], .name-input { background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); border-radius: var(--r-sm); padding: 0 12px; height: 42px; font-family: var(--font-mono); font-size: 14px; outline: none; -webkit-appearance: none; appearance: none; }

    .progress-label { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); text-align: center; }
    .chart-canvas { width: 100%; height: 110px; border-radius: var(--r-md); background: var(--chart-bg); display: block; }

    /* ─── Result & confusion ─── */
    .result-box { background: var(--paper-2); border-radius: var(--r-md); padding: 14px; display: flex; flex-direction: column; gap: 12px; }

    .stat.primary { background: var(--yellow-soft); color: var(--yellow-ink); box-shadow: none; }

    .stat span { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: inherit; opacity: .8; display: block; margin-top: 4px; }

    .confusion .cell { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-radius: var(--r-xs); background: var(--surface); color: var(--ink-3); font-weight: 500; min-width: 0; overflow: hidden; }
    .confusion .cell.head { background: none; color: var(--ink-2); font-size: 10px; letter-spacing: .04em; text-overflow: ellipsis; white-space: nowrap; display: block; text-align: center; line-height: 2.4; aspect-ratio: auto; }
    .confusion .cell.diag { background: var(--green-soft); color: var(--green-ink); }

    .hint { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
    .section-label { font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
    .gap-6 { display: flex; flex-direction: column; gap: 6px; }
    .notice { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: var(--r-md); font-size: 14px; }

    .or-sep::before, .or-sep::after { content: ''; flex: 1; height: 1px; background: var(--line-2); }

    /* ─── Saved models ─── */
    .saved-model-row { display: flex; gap: 8px; align-items: center; }
    .saved-model-row select { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); border-radius: var(--r-sm); padding: 0 12px; height: 44px; font-size: 15px; outline: none; -webkit-appearance: none; appearance: none; }
    .sq-btn { background: var(--paper-2); border: none; color: var(--ink-2); width: 44px; height: 44px; border-radius: var(--r-pill); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

    /* ─── Inference ─── */
    .infer-overlay { position: absolute; top: 8px; left: 8px; right: 60px; pointer-events: none; }
    .pred-raw { font-family: var(--font-mono); font-size: 11px; background: var(--overlay); color: var(--yellow); padding: 5px 9px; border-radius: var(--r-pill); display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .infer-top-label { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -.02em; text-align: center; padding: 14px; border-radius: var(--r-md); background: var(--surface); box-shadow: var(--shadow-sm); min-height: 64px; display: flex; align-items: center; justify-content: center; }
    .infer-top-label.idle { color: var(--ink-3); font-family: var(--font-sans); font-style: italic; font-size: 15px; font-weight: 500; }
    .conf-bar-row { margin-bottom: 8px; }
    .conf-bar-header { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; margin-bottom: 4px; }
    .conf-bar-track { background: var(--surface); border-radius: var(--r-pill); height: 8px; overflow: hidden; }
    .conf-bar-fill { height: 100%; border-radius: var(--r-pill); transition: width .15s; }

    /* ─── Terminal ─── */
    .log-box { background: var(--term-bg); border-radius: var(--r-md); padding: 12px 14px; min-height: 90px; max-height: 40vh; overflow-y: auto; font-size: 11px; font-family: var(--font-mono); line-height: 1.7; color: var(--term-text); }
    .log-info { color: var(--term-info); } .log-success { color: var(--term-success); } .log-warn { color: var(--term-warn); } .log-error { color: var(--term-error); } .log-step { color: var(--term-step); font-weight: 500; }

    /* ─── Sticky bottom bar ─── */
    .action-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: none; align-items: center; gap: 12px; padding: 10px 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--chrome-bg-strong); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--line); min-height: var(--bar-h); }
    .action-bar.visible { display: flex; }
    .action-status { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.35; }
    .action-status b { display: block; font-family: var(--font-display); color: var(--ink); font-size: 15px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .action-bar .btn { min-width: 150px; }

    /* ─── Toasts ─── */
    .toast-host { position: fixed; left: 16px; right: 16px; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 20; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }

    .toast.show { opacity: 1; transform: none; }
    .toast.warn { background: var(--yellow-soft); color: var(--yellow-ink); } .toast.error { background: var(--red-soft); color: var(--red-ink); } .toast.ok { background: var(--green-soft); color: var(--green-ink); }

    /* ─── Confirm sheet ─── */
    .sheet-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: none; align-items: flex-end; justify-content: center; }
    .sheet-scrim.open { display: flex; }
    .sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 20px 16px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-lg); animation: sheet-in .2s ease-out; }
    @keyframes sheet-in { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    .sheet h3 { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
    .sheet p { font-size: 14px; color: var(--ink-2); line-height: 1.5; }

    /* ─── Icons ─── */
    .lucide { width: 18px; height: 18px; stroke-width: 1.75; }
    .lucide-sm { width: 16px; height: 16px; stroke-width: 1.75; }
    .lucide-lg { width: 24px; height: 24px; stroke-width: 1.75; }

    @media (max-width: 768px) { .action-bar .btn { min-width: 132px; } }
    @media (min-width: 769px) { .scroll-area { max-width: 640px; width: 100%; margin: 0 auto; } .action-bar { justify-content: center; } .action-bar .action-status { max-width: 400px; } }
  </style>

// ─── Helpers: feedback ───
function announce(msg, assertive) {
  const el = $(assertive ? 'live-alert' : 'live');
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 20);
}
function toast(msg, type = 'info', ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  toastHost.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, ms);
  announce(msg, type === 'error');
}
function log(screen, type, msg) {
  const box = $(screen + '-log');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'log-' + type;
  const ts = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  el.textContent = '[' + ts + '] ' + msg;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}
const tlog = (type, msg) => log('train', type, msg);
const ilog = (type, msg) => log('infer', type, msg);
function haptic(ms = 8) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {} }
function refreshIcons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }
function cssToken(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function classColor(i) { return `var(${CLASS_COLOR_TOKENS[i % CLASS_COLOR_TOKENS.length]})`; }
function classInk(i) { return `var(${CLASS_COLOR_TOKENS[i % CLASS_COLOR_TOKENS.length]}-ink)`; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }
function mulberry32(seed) {
  return function () {
    let s = (seed += 0x6D2B79F5);
    s = Math.imul(s ^ (s >>> 15), s | 1);
    s ^= s + Math.imul(s ^ (s >>> 7), s | 61);
    return ((s ^ (s >>> 14)) >>> 0) / 4294967296;
  };
}

// ─── Helpers: confirm sheet ───
function confirmSheet({ title, body, actions }) {
  return new Promise(resolve => {
    sheetResolve = resolve;
    $('sheet-title').textContent = title;
    $('sheet-body').textContent = body || '';
    const host = $('sheet-actions');
    host.innerHTML = '';
    actions.forEach(a => {
      const b = document.createElement('button');
      b.className = 'btn ' + (a.kind === 'danger' ? 'btn-danger' : a.kind === 'primary' ? 'btn-primary' : 'btn-secondary');
      b.textContent = a.label;
      b.addEventListener('click', () => closeSheet(a.value));
      host.appendChild(b);
    });
    const c = document.createElement('button');
    c.className = 'btn btn-secondary'; c.textContent = t('cancel');
    c.addEventListener('click', () => closeSheet(null));
    host.appendChild(c);
    sheetScrim.classList.add('open');
  });
}
function closeSheet(value) {
  sheetScrim.classList.remove('open');
  if (sheetResolve) { const r = sheetResolve; sheetResolve = null; r(value); }
}

// ─── Helpers: wake lock ───
async function acquireWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (_) { wakeLock = null; }
}
function releaseWakeLock() {
  if (wakeLock) { try { wakeLock.release(); } catch (_) {} wakeLock = null; }
}
function updateWakeLock() {
  if (trainStream || inferStream || trainPhase === 'training') acquireWakeLock(); else releaseWakeLock();
}

// ─── Helpers: IndexedDB (dataset + model metadata) ───
function openDB() {
  if (db) return Promise.resolve(db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('samples')) {
        const s = d.createObjectStore('samples', { keyPath: 'id' });
        s.createIndex('classId', 'classId', { unique: false });
      }
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'key' });
    };
    const timer = setTimeout(() => reject(new Error('IndexedDB open timed out')), IDB_OPEN_TIMEOUT_MS);
    req.onsuccess = () => { clearTimeout(timer); db = req.result; resolve(db); };
    req.onerror = () => { clearTimeout(timer); reject(req.error); };
    req.onblocked = () => { clearTimeout(timer); reject(new Error('IndexedDB blocked by another tab')); };
  });
}
const idbPutMany = (store, values) => idbTx(store, 'readwrite', os => { values.forEach(v => os.put(v)); return null; });
function idbTx(store, mode, fn) {
  return openDB().then(d => new Promise((resolve, reject) => {
    const tx = d.transaction(store, mode);
    const os = tx.objectStore(store);
    let result;
    try { result = fn(os); } catch (e) { reject(e); return; }
    tx.oncomplete = () => resolve(result instanceof IDBRequest ? result.result : result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  }));
}
const idbPut = (store, value) => idbTx(store, 'readwrite', os => os.put(value));
const idbDel = (store, key) => idbTx(store, 'readwrite', os => os.delete(key));
const idbGet = (store, key) => idbTx(store, 'readonly', os => os.get(key));
const idbAll = (store) => idbTx(store, 'readonly', os => os.getAll());
const idbClear = (store) => idbTx(store, 'readwrite', os => os.clear());
function idbDeleteByClass(classId) {
  return idbTx('samples', 'readwrite', os => {
    const idx = os.index('classId');
    const req = idx.openKeyCursor(IDBKeyRange.only(classId));
    req.onsuccess = () => { const c = req.result; if (c) { os.delete(c.primaryKey); c.continue(); } };
    return null;
  });
}
function persistClasses() { return idbPut('meta', { key: 'classes', value: classes }).catch(() => {}); }
let persistTimer = null;
function persistClassesSoon() { clearTimeout(persistTimer); persistTimer = setTimeout(persistClasses, PERSIST_DEBOUNCE_MS); }
async function restoreDataset() {
  try {
    const cls = await idbGet('meta', 'classes');
    const rows = await idbAll('samples');
    if (cls && Array.isArray(cls.value) && cls.value.length) {
      classes = cls.value;
      classes.forEach(c => { samples[c.id] = []; });
      const known = new Set(classes.map(c => c.id));
      let n = 0;
      for (const r of rows) {
        if (!known.has(r.classId)) { idbDel('samples', r.id).catch(() => {}); continue; }
        samples[r.classId].push({ id: r.id, feat: new Float32Array(r.feat), thumbUrl: r.thumb ? URL.createObjectURL(r.thumb) : '' });
        n++;
      }
      if (rows.length && rows[0].feat) featSize = new Float32Array(rows[0].feat).length;
      if (n) toast(t('t_dataset_restored', n, classes.length), 'ok');
      return;
    }
  } catch (e) { tlog('warn', 'IndexedDB: ' + e.message); }
  if (!classes.length) {
    classes = [{ id: uid(), name: t('class_default', 1) }, { id: uid(), name: t('class_default', 2) }];
    classes.forEach(c => { samples[c.id] = []; });
    persistClasses();
  }
}

// ─── Helpers: image capture ───
function videoReady(vid) { return vid && vid.srcObject && vid.readyState >= 2 && vid.videoWidth > 0; }
function cropSquare(vid, ctx, size) {
  const vw = vid.videoWidth, vh = vid.videoHeight;
  const s = Math.min(vw, vh);
  const sx = (vw - s) / 2, sy = (vh - s) / 2;
  ctx.drawImage(vid, sx, sy, s, s, 0, 0, size, size);
}
function makeThumb(fromCanvas) {
  return new Promise(resolve => {
    thumbCtx.drawImage(fromCanvas, 0, 0, THUMB_SIZE, THUMB_SIZE);
    thumbCanvas.toBlob(b => resolve(b), 'image/jpeg', 0.8);
  });
}

// ─── Base model ───
function setBaseStatus(status, progress) {
  baseStatus = status;
  if (progress !== undefined) baseProgress = progress;
  bodyEl.dataset.baseStatus = status;
  renderBaseChips();
  renderBars();
}
function ensureBaseModel() {
  if (baseModel) { if (baseStatus !== 'ready') setBaseStatus('ready', 100); return Promise.resolve(baseModel); }
  if (baseLoading) return baseLoading;
  const gen = ++baseGen;
  setBaseStatus('loading', 0);
  baseLoading = (async () => {
    let model = null;
    try {
      try {
        model = await tf.loadGraphModel(BASE_IDB_KEY);
        tlog('info', t('log_base_cache'));
        if (gen === baseGen) setBaseStatus('loading', 100);
      } catch (_) {
        tlog('step', t('log_base_net'));
        model = await tf.loadGraphModel(MODEL_URL, { onProgress: f => { if (gen === baseGen) setBaseStatus('loading', Math.round(f * 100)); } });
        try { await model.save(BASE_IDB_KEY); tlog('success', t('log_base_saved')); } catch (e) { tlog('warn', 'Base cache: ' + e.message); }
      }
      if (gen !== baseGen) { try { model.dispose(); } catch (_) {} return baseModel; } // a bundled base was installed meanwhile
      installBase(model);
      return baseModel;
    } catch (e) {
      if (gen !== baseGen) return baseModel;
      baseLoading = null;
      setBaseStatus('error');
      tlog('error', t('t_base_error') + e.message);
      toast(t('t_base_error') + e.message, 'error', 4000);
      throw e;
    }
  })();
  return baseLoading;
}
// Makes `model` the active base: warms it up, marks ready, and embeds any queued frames.
function installBase(model) {
  baseModel = model;
  baseLoading = null;
  const warm = tf.tidy(() => baseModel.predict(tf.zeros([1, INPUT_SIZE, INPUT_SIZE, 3])));
  featSize = warm.shape[1];
  warm.dispose();
  setBaseStatus('ready', 100);
  embedPending();
}

// ─── Embedding (features at capture time) ───
async function embedPending() {
  if (embedding || !baseModel || !pending.length) return;
  embedding = true;
  renderBars();
  let done = 0;
  try {
    while (pending.length) {
      const batch = pending.splice(0, EMBED_BATCH);
      batch.forEach(p => { inFlight[p.classId] = (inFlight[p.classId] || 0) + 1; });
      const gens = batch.map(p => clearGen[p.classId] || 0);
      const feats = tf.tidy(() => {
        const imgs = batch.map(p => tf.browser.fromPixels(p.img).toFloat().div(255));
        return baseModel.predict(tf.stack(imgs));
      });
      const data = await feats.data();
      const fs = feats.shape[1];
      feats.dispose();
      featSize = fs;
      const rows = [];
      const touched = new Set();
      for (let i = 0; i < batch.length; i++) {
        const p = batch[i];
        if (!samples[p.classId] || (clearGen[p.classId] || 0) !== gens[i]) continue; // class removed or cleared while in flight
        const feat = data.slice(i * fs, (i + 1) * fs);
        const s = { id: uid(), feat, thumbUrl: p.thumbBlob ? URL.createObjectURL(p.thumbBlob) : '' };
        samples[p.classId].push(s);
        rows.push({ id: s.id, classId: p.classId, feat: feat.buffer, thumb: p.thumbBlob });
        appendThumb(p.classId, s.thumbUrl);
        touched.add(p.classId);
        done++;
      }
      batch.forEach(p => { inFlight[p.classId] = Math.max(0, (inFlight[p.classId] || 0) - 1); });
      if (rows.length) idbPutMany('samples', rows).catch(e => tlog('warn', 'IDB: ' + e.message));
      touched.forEach(updateCountLabel);
      await tf.nextFrame();
    }
  } catch (e) {
    tlog('error', 'Embedding: ' + e.message);
  } finally {
    inFlight = {};
    embedding = false;
    classes.forEach(c => updateCountLabel(c.id));
    renderBars();
    renderDataChip();
    if (done) tlog('info', t('t_embedded', done));
    if (pending.length) embedPending();
  }
}

// ─── Camera ───
async function getCameraStream(facingMode) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const insecure = location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname);
    throw new Error(insecure ? t('t_cam_https') : 'getUserMedia unavailable');
  }
  const fm = facingMode || 'environment';
  const attempts = [
    { video: { facingMode: { exact: fm }, width: { ideal: 640 }, height: { ideal: 480 } } },
    { video: { facingMode: fm } },
    { video: true },
  ];
  let lastErr;
  for (const c of attempts) {
    try { return await navigator.mediaDevices.getUserMedia(c); }
    catch (e) { lastErr = e; if (['NotAllowedError', 'PermissionDeniedError', 'SecurityError'].includes(e.name)) throw e; }
  }
  throw lastErr || new Error('No camera');
}
function cameraErrorToast(err, screen) {
  const msg = ['NotAllowedError', 'PermissionDeniedError'].includes(err.name) ? t('t_cam_denied')
    : err.name === 'SecurityError' ? t('t_cam_https') : t('t_cam_error') + err.message;
  toast(msg, 'error', 4000);
  log(screen, 'error', 'Camera: ' + err.name + ' ' + err.message);
}

    if (trainStream) trainStream.getTracks().forEach(tr => tr.stop());
    trainStream = await getCameraStream(trainFacingMode);
    trainVideo.srcObject = trainStream;
    trainVideo.play().catch(() => {});
    tlog('success', 'Camera on');
  } catch (err) {

  } finally {
    btn.disabled = false;
    renderCameraButtons();
    updateWakeLock();
  }
}

function startHold(classId) {
  if (holdClassId) return;

  if (!videoReady(trainVideo)) { toast(t('t_cam_loading'), 'warn'); return; }
  if (trainPhase === 'training') return;
  if (pending.length >= MAX_PENDING) { toast(t('t_pending_full'), 'warn'); ensureBaseModel().catch(() => {}); return; }
  holdClassId = classId; holdCount = 0;

  if (baseStatus !== 'ready') { toast(t('t_base_wait'), 'info'); ensureBaseModel().catch(() => {}); }

}

  if (have >= MAX_SAMPLES_PER_CLASS) { toast(t('t_max_samples', MAX_SAMPLES_PER_CLASS), 'warn'); stopHold(); return; }
  if (pending.length >= MAX_PENDING) { toast(t('t_pending_full'), 'warn'); stopHold(); return; }
  cropSquare(trainVideo, cropCtx, INPUT_SIZE);
  const img = cropCtx.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE);
  const entry = { classId, img, thumbBlob: null };
  pending.push(entry);

  const cls = classes.find(c => c.id === classId);

// ─── Training ───
function holdoutSplit() {
  const train = [], test = [];
  classes.forEach((c, ci) => {
    const list = samples[c.id] || [];
    const n = list.length;
    const order = list.map((_, i) => i);
    const rng = mulberry32(n * 1000 + ci);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    const nTest = n >= 2 ? Math.max(1, Math.round(n * HOLDOUT_FRACTION)) : 0;
    order.forEach((idx, k) => (k < nTest ? test : train).push({ feat: list[idx].feat, label: ci }));
  });
  return { train, test };
}
function toTensors(rows, numClasses) {
  const n = rows.length;
  const x = new Float32Array(n * featSize);
  const y = new Int32Array(n);
  rows.forEach((r, i) => { x.set(r.feat, i * featSize); y[i] = r.label; });
  const xs = tf.tensor2d(x, [n, featSize]);
  const yT = tf.tensor1d(y, 'int32');
  const ys = tf.oneHot(yT, numClasses);
  yT.dispose();
  return { xs, ys, y };
}
function drawChart() {
  const cv = $('train-chart'); if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = cv.offsetWidth || 300, H = 110;
  cv.width = W; cv.height = H;
  ctx.fillStyle = cssToken('--chart-bg'); ctx.fillRect(0, 0, W, H);
  const series = [
    { data: lossHistory, color: cssToken('--chart-loss'), label: 'loss', min: 0, max: Math.max(...lossHistory, 1) },
    { data: accHistory, color: cssToken('--chart-acc'), label: 'acc', min: 0, max: 1 },
    { data: valHistory, color: cssToken('--chart-val'), label: 'val', min: 0, max: 1 },
  ];
  series.forEach(s => {
    if (s.data.length < 2) return;
    const range = s.max - s.min || 1;
    ctx.beginPath(); ctx.strokeStyle = s.color; ctx.lineWidth = 2;
    s.data.forEach((v, i) => {
      const x = (i / (s.data.length - 1)) * (W - 20) + 10;
      const y = H - 10 - ((v - s.min) / range) * (H - 24);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
  ctx.font = "10px 'Roboto Mono', ui-monospace, monospace";
  let x = 8;
  series.forEach(s => {
    const last = s.data.length ? s.data[s.data.length - 1] : null;
    const txt = s.label + (last === null ? '' : ' ' + (s.label === 'loss' ? last.toFixed(3) : (last * 100).toFixed(0) + '%'));
    ctx.fillStyle = s.color; ctx.fillText(txt, x, 12); x += ctx.measureText(txt).width + 12;
  });
}
function renderConfusion(matrix, labels) {
  const host = $('confusion');
  const n = labels.length;
  host.style.gridTemplateColumns = `minmax(0, 1.4fr) repeat(${n}, minmax(0, 1fr))`;
  const cells = ['<div class="cell head"></div>'];
  labels.forEach(l => cells.push(`<div class="cell head" title="${escapeHtml(l)}">${escapeHtml(l)}</div>`));
  matrix.forEach((row, i) => {
    cells.push(`<div class="cell head" title="${escapeHtml(labels[i])}">${escapeHtml(labels[i])}</div>`);
    row.forEach((v, j) => cells.push(`<div class="cell ${i === j ? (v ? 'diag' : '') : (v ? 'off' : '')}">${v}</div>`));
  });
  host.innerHTML = cells.join('');
}
async function runTraining() {
  if (trainPhase === 'training') return;
  if (!readyToTrain()) { toast(t('train_bar_need', 2, MIN_SAMPLES_TO_TRAIN), 'warn'); return; }
  if (!baseModel) { toast(t('train_bar_base_loading'), 'warn'); ensureBaseModel().catch(() => {}); return; }
  stopHold();
  classes.forEach(c => { if ((samples[c.id] || []).length < MIN_RECOMMENDED) toast(t('t_low_samples', c.name), 'warn', 3500); });

  trainingCancelled = false;
  lossHistory = []; accHistory = []; valHistory = [];
  const epochs = Math.max(1, Math.min(200, parseInt($('train-epochs').value || '30', 10)));
  const lr = parseFloat($('train-lr').value || '0.001');
  const batchSize = parseInt($('train-batch').value || '16', 10);
  const numClasses = classes.length;
  const labels = classes.map(c => c.name);

  setTrainPhase('training');
  setStep('data', 'done'); openStep('data', false);
  setStep('train', 'processing'); openStep('train', true); scrollToCard('train');
  $('train-result').style.display = 'none';
  const progWrap = $('train-progress-wrap'), progBar = $('train-progress');
  progWrap.style.display = ''; progBar.style.width = '0%';
  const barBtn = $('train-bar-btn');
  const { train, test } = holdoutSplit();
  tlog('step', `Training: ${epochs} epochs, lr ${lr}, batch ${batchSize}`);
  tlog('info', t('log_split', train.length, test.length));
  await tf.nextFrame();

  let tr = null, te = null, classifier = null;
  try {
    tr = toTensors(train, numClasses);
    te = test.length ? toTensors(test, numClasses) : null;
    classifier = tf.sequential({
      layers: [
        tf.layers.dense({ inputShape: [featSize], units: 128, activation: 'relu' }),
        tf.layers.dropout({ rate: 0.3 }),
        tf.layers.dense({ units: numClasses, activation: 'softmax' }),
      ]
    });
    classifier.compile({ optimizer: tf.train.adam(lr), loss: 'categoricalCrossentropy', metrics: ['accuracy'] });
    const t0 = Date.now();
    await classifier.fit(tr.xs, tr.ys, {
      epochs, batchSize, shuffle: true,
      validationData: te ? [te.xs, te.ys] : undefined,
      callbacks: {
        onEpochBegin: async (epoch) => {
          if (trainingCancelled) throw new Error('cancelled');
          barBtn.dataset.epoch = t('train_bar_epoch', epoch + 1, epochs);
          $('train-bar-sub').textContent = barBtn.dataset.epoch;
          setStep('train', 'processing', t('train_bar_epoch', epoch + 1, epochs));
        },
        onEpochEnd: async (epoch, logs) => {
          const acc = logs.acc ?? logs.accuracy ?? 0;
          const val = logs.val_acc ?? logs.val_accuracy ?? acc;
          lossHistory.push(logs.loss); accHistory.push(acc); valHistory.push(val);
          drawChart();
          const elapsed = (Date.now() - t0) / 1000;
          const eta = Math.round((epochs - epoch - 1) * elapsed / (epoch + 1));
          progBar.style.width = Math.round(((epoch + 1) / epochs) * 100) + '%';
          $('train-label').textContent = `${t('train_bar_epoch', epoch + 1, epochs)} · val ${(val * 100).toFixed(0)}% · ETA ${eta}s`;
          tlog('info', t('log_epoch', epoch + 1, logs.loss.toFixed(4), (acc * 100).toFixed(1), (val * 100).toFixed(1)));
          await tf.nextFrame();
        }
      }
    });

    // Evaluate on the held-out set
    const matrix = Array.from({ length: numClasses }, () => Array(numClasses).fill(0));
    let valAcc = accHistory[accHistory.length - 1] || 0;
    if (te) {
      const predIdx = tf.tidy(() => classifier.predict(te.xs).argMax(1));
      const preds = await predIdx.data(); predIdx.dispose();
      let hits = 0;
      for (let i = 0; i < preds.length; i++) { matrix[te.y[i]][preds[i]]++; if (preds[i] === te.y[i]) hits++; }
      valAcc = preds.length ? hits / preds.length : 0;
    }
    const trainAcc = accHistory[accHistory.length - 1] || 0;
    modelMetadata = {
      schemaVersion: SCHEMA_VERSION, classLabels: labels, inputSize: INPUT_SIZE, featSize,
      trainAccuracy: trainAcc, valAccuracy: valAcc, trainingAccuracy: valAcc,
      nTrain: train.length, nTest: test.length, confusion: matrix,
      baseModel: 'MobileNetV3-Small', baseModelUrl: MODEL_URL, timestamp: new Date().toISOString(),
    };
    if (trainedModel && trainedModel !== inferModel) { try { trainedModel.dispose(); } catch (_) {} }
    trainedModel = classifier; classifier = null;
    trainedModel.userDefinedMetadata = modelMetadata;

    $('stat-val').textContent = (valAcc * 100).toFixed(0) + '%';
    $('stat-train').textContent = (trainAcc * 100).toFixed(0) + '%';
    $('stat-n').textContent = `${train.length} / ${test.length}`;
    renderConfusion(matrix, labels);
    $('train-result').style.display = '';
    $('train-label').textContent = t('train_bar_done_sub', (valAcc * 100).toFixed(0));
    setStep('train', 'done');
    tlog('success', t('t_training_done', (valAcc * 100).toFixed(1)));
    toast(t('t_training_done', (valAcc * 100).toFixed(0)), 'ok');
    setTrainPhase('done');
    await autoSave();
  } catch (err) {
    if (err.message === 'cancelled') { tlog('warn', t('t_training_stopped')); toast(t('t_training_stopped'), 'warn'); setStep('train', ''); }
    else { tlog('error', t('t_training_error') + err.message); toast(t('t_training_error') + err.message, 'error', 4000); setStep('train', 'error'); }
    if (classifier) { try { classifier.dispose(); } catch (_) {} }
    setTrainPhase('collect');
  } finally {
    if (tr) { tr.xs.dispose(); tr.ys.dispose(); }
    if (te) { te.xs.dispose(); te.ys.dispose(); }
    delete barBtn.dataset.epoch;
    renderBars();
  }
}

function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer); const CHUNK = 0x8000; const parts = [];
  for (let i = 0; i < bytes.length; i += CHUNK) parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK)));
  return btoa(parts.join(''));
}
function base64ToArrayBuffer(b64) {
  const bin = atob(b64); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function normalizeWeightData(wd) {
  if (Array.isArray(wd)) { const total = wd.reduce((s, b) => s + b.byteLength, 0); const m = new Uint8Array(total); let o = 0; for (const b of wd) { m.set(new Uint8Array(b), o); o += b.byteLength; } return m.buffer; }
  if (wd instanceof ArrayBuffer) return wd;
  if (typeof wd.slice === 'function') return wd.slice(0);
  return new Uint8Array(wd).buffer;
}
async function captureArtifacts(model) {

  await model.save({ save: async (art) => { a = art; return { modelArtifactsInfo: { dateSaved: new Date() } }; } });
  return { modelTopology: a.modelTopology, weightSpecs: a.weightSpecs, weightData: arrayBufferToBase64(normalizeWeightData(a.weightData)), format: a.format };
}

// ─── Inference: self-scheduling loop ───
async function inferTick(gen) {
  if (!inferRunning || gen !== inferGen) return;
  const started = performance.now();
  if (inferModel && baseModel && videoReady(inferVideo)) {
    try {
      cropSquare(inferVideo, cropCtx, INPUT_SIZE);
      const probsT = tf.tidy(() => {
        const x = tf.browser.fromPixels(cropCanvas).toFloat().div(255).expandDims(0);
        return inferModel.predict(baseModel.predict(x));
      });
      const probs = Array.from(await probsT.data()); probsT.dispose();
      renderPrediction(probs);
    } catch (e) { ilog('warn', 'Predict: ' + e.message); }
  }
  if (!inferRunning || gen !== inferGen) return;
  const interval = parseInt($('infer-fps').value || '200', 10);
  const wait = Math.max(0, interval - (performance.now() - started));
  setTimeout(() => inferTick(gen), wait);
}
function renderPrediction(probs) {
  const labels = (inferMeta && inferMeta.classLabels) || classes.map(c => c.name);
  const thresh = parseFloat($('infer-threshold').value || '0.7');
  let maxIdx = 0; for (let i = 1; i < probs.length; i++) if (probs[i] > probs[maxIdx]) maxIdx = i;
  const conf = probs[maxIdx];
  $('pred-raw').textContent = probs.map(p => p.toFixed(3)).join('  ');
  const top = $('pred-top-label');
  if (conf >= thresh) { top.textContent = `${labels[maxIdx] || maxIdx} · ${(conf * 100).toFixed(0)}%`; top.className = 'infer-top-label'; top.style.color = classColor(maxIdx); }
  else { top.textContent = t('below_threshold'); top.className = 'infer-top-label idle'; top.style.color = ''; }
  top.dataset.label = conf >= thresh ? (labels[maxIdx] || String(maxIdx)) : '';
  top.dataset.confidence = conf.toFixed(3);
  const bars = $('pred-bars');
  if (bars.childElementCount !== probs.length) {
    bars.innerHTML = probs.map((_, i) => `<div class="conf-bar-row"><div class="conf-bar-header"><span style="color:${classColor(i)}">${escapeHtml(labels[i] || ('Class ' + i))}</span><span class="pct" style="color:var(--muted)"></span></div><div class="conf-bar-track"><div class="conf-bar-fill" style="background:${classColor(i)};width:0%"></div></div></div>`).join('');
  }
  probs.forEach((p, i) => {
    const row = bars.children[i]; if (!row) return;
    row.querySelector('.pct').textContent = (p * 100).toFixed(1) + '%';
    row.querySelector('.conf-bar-fill').style.width = (p * 100).toFixed(1) + '%';
  });
}

// ─── Listeners ───
$('btn-go-train').addEventListener('click', goToTraining);
$('btn-go-infer').addEventListener('click', goToInference);
document.querySelectorAll('[data-go-home]').forEach(b => b.addEventListener('click', goHome));
document.querySelectorAll('[data-lang-toggle]').forEach(b => b.addEventListener('click', toggleLang));
document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => { const body = $('body-' + b.dataset.toggle); if (body) body.classList.toggle('collapsed'); }));
['home-base-chip', 'train-base-chip', 'infer-base-chip'].forEach(id => $(id).addEventListener('click', () => { if (baseStatus === 'error' || baseStatus === 'idle') ensureBaseModel().catch(() => {}); }));

$('btn-toggle-cam').addEventListener('click', () => trainStream ? stopTrainCamera() : startTrainCamera());
$('btn-flip-train').addEventListener('click', flipTrainCamera);
$('btn-add-class').addEventListener('click', addClass);
$('btn-clear-dataset').addEventListener('click', clearDataset);

classListEl.addEventListener('input', e => {
  const inp = e.target.closest('.class-name-input'); if (!inp) return;
  const c = classes.find(x => x.id === inp.dataset.id); if (c) { c.name = inp.value; persistClassesSoon(); }
});
classListEl.addEventListener('pointerdown', e => {
  const btn = e.target.closest('.hold-btn'); if (!btn) return;
  e.preventDefault();
  try { btn.setPointerCapture(e.pointerId); } catch (_) {}
  startHold(btn.dataset.hold);
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => classListEl.addEventListener(ev, e => { if (e.target.closest('.hold-btn')) stopHold(); }));
classListEl.addEventListener('contextmenu', e => { if (e.target.closest('.hold-btn')) e.preventDefault(); });
classListEl.addEventListener('keydown', e => {
  const btn = e.target.closest('.hold-btn'); if (!btn) return;
  if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); startHold(btn.dataset.hold); }
});
classListEl.addEventListener('keyup', e => { if (e.target.closest('.hold-btn') && (e.key === ' ' || e.key === 'Enter')) stopHold(); });
classListEl.addEventListener('click', e => {
  const m = e.target.closest('.class-menu-btn'); if (m) classMenu(m.dataset.menu);
});
window.addEventListener('blur', stopHold);

$('train-bar-btn').addEventListener('click', () => {
  const a = $('train-bar-btn').dataset.action;
  if (a === 'train') runTraining(); else if (a === 'stop') stopTraining(); else if (a === 'test') goToInferenceFromTraining();
});
$('btn-save-idb').addEventListener('click', resaveToIDB);
$('btn-download').addEventListener('click', () => downloadModel(false));
$('btn-download-full').addEventListener('click', () => downloadModel(true));

$('btn-refresh-models').addEventListener('click', refreshModelList);
$('btn-delete-model').addEventListener('click', deleteSelectedModel);
$('btn-load-idb').addEventListener('click', loadFromIDB);
$('idb-model-select').addEventListener('change', renderBars);
$('btn-open-file').addEventListener('click', () => $('infer-file-input').click());
$('infer-file-input').addEventListener('change', loadFromFile);
$('btn-toggle-infer').addEventListener('click', () => inferStream ? stopInferCamera() : startInferCamera());
$('btn-flip-infer').addEventListener('click', flipInferCamera);
$('btn-retrain').addEventListener('click', goToTrainingFromInference);
$('infer-bar-btn').addEventListener('click', () => {
  const a = $('infer-bar-btn').dataset.action;
  if (a === 'load') loadFromIDB(); else if (a === 'startcam') startInferCamera(); else if (a === 'stopcam') stopInferCamera();
});

sheetScrim.addEventListener('click', e => { if (e.target === sheetScrim) closeSheet(null); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (sheetScrim.classList.contains('open')) closeSheet(null); else if (currentScreen !== 'home') goHome(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    const had = trainStream || inferStream;
    stopHold(); stopTrainCamera(); stopInferCamera();
    if (had) { log(currentScreen === 'inference' ? 'infer' : 'train', 'warn', t('t_hidden_stop')); }
  } else { updateWakeLock(); }
});
window.addEventListener('resize', () => { if (lossHistory.length) drawChart(); });

// ─── Init ───
(async function init() {
  lang = (navigator.language || 'pl').toLowerCase().startsWith('pl') ? 'pl' : 'en';
  try { const stored = localStorage.getItem(LANG_KEY); if (stored === 'pl' || stored === 'en') lang = stored; } catch (_) {}
  applyLang(); // labels first, so a stalled IndexedDB never leaves the UI blank
  await restoreDataset();
  renderClassList(); renderBars(); renderDataChip();
  refreshIcons();
  ensureBaseModel().catch(() => {});
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && !navigator.serviceWorker.controller) toast(t('t_offline_ready'), 'ok'); });
      });
    }).catch(() => {});
  }
  // DOM contract for automated checks
  window.KLOCKI = {
    get state() { return { screen: currentScreen, baseStatus, trainPhase, classes: classes.map(c => ({ id: c.id, name: c.name, n: (samples[c.id] || []).length })), pending: pending.length, featSize, hasModel: !!trainedModel, meta: modelMetadata }; },
    startHold, stopHold, runTraining, ensureBaseModel, embedPending, refreshModelList, loadFromIDB,
  };
  bodyEl.dataset.ready = '1';
})();
</script>
</body>
</html>
